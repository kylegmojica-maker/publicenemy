<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PUBLIC ENEMY</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            background-image: url("https://media.discordapp.net/attachments/1526941627418152970/1533885730936590438/Gemini_Generated_Image_cmvzocmvzocmvzoc.png?ex=6a795e28&is=6a780ca8&hm=024de590d97683448564e054e4e06023ea920e80f8ab28a134c23f11dca822e0&format=webp&quality=lossless&width=1024&height=572");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

    </style>

</head>

<body>


<!-- ENTER SCREEN -->

<div id="enter-screen">

    <div class="enter-content">

        <div class="enter-label">
            WELCOME
        </div>

        <button id="enter-button">
            ENTER
        </button>

    </div>

</div>


<!-- MAIN WEBSITE -->

<div id="main-site">

    <!-- NAVIGATION -->

    <header class="navbar">

        <div class="nav-logo">
            PE
        </div>

        <nav>

            <a href="#home">
                HOME
            </a>

            <a
                href="https://discord.gg/PJ6S48X5Qq"
                target="_blank"
                rel="noopener noreferrer"
            >
                DISCORD
            </a>

            <div class="views">

                <span>VIEWS</span>

                <strong id="view-count">
                    0
                </strong>

            </div>

        </nav>

    </header>


    <!-- MAIN -->

    <main>

        <section id="home" class="hero">

            <div class="hero-content">


                <!-- MAIN PROFILE -->

                <div class="profile-wrapper">

                    <div class="profile-ring"></div>

                    <img
                        src="https://media.discordapp.net/attachments/1489145774569951332/1508056143463710870/image-56.png?ex=6a7900fa&is=6a77af7a&hm=18a90b56911f45264603c614bf2b86f73ee75059be7b3ee245390ac309b6bb9b&format=webp&quality=lossless&width=640&height=640"
                        class="main-profile"
                        alt="PUBLIC ENEMY"
                    >

                </div>


                <!-- NAME -->

                <h1 class="main-title">
                    PUBLIC ENEMY
                </h1>


                <!-- DISCORD BUTTON -->

                <a
                    href="https://discord.gg/PJ6S48X5Qq"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="discord-button"
                >
                    JOIN SERVER
                </a>

            </div>

        </section>


        <!-- DISCORD PEOPLE -->

        <section id="people" class="people-section">


            <!-- GODFATHER -->

            <div class="role-section">

                <div class="role-title">
                    GODFATHER
                </div>

                <div
                    id="godfather-list"
                    class="people-grid"
                ></div>

            </div>


            <!-- HIGHCOUNCIL -->

            <div class="role-section">

                <div class="role-title">
                    HIGHCOUNCIL
                </div>

                <div
                    id="highcouncil-list"
                    class="people-grid"
                ></div>

            </div>


            <!-- MEMBERS -->

            <div class="role-section">

                <div class="role-title">
                    MEMBERS
                </div>

                <div
                    id="members-list"
                    class="people-grid"
                ></div>

            </div>

        </section>

    </main>


    <!-- PROFILE POPUP -->

    <div
        id="profile-modal"
        class="profile-modal"
    >

        <div class="profile-modal-content">

            <button
                id="close-profile"
                class="close-profile"
            >
                ×
            </button>


            <img
                id="modal-avatar"
                class="modal-avatar"
                src=""
                alt="Discord Profile"
            >


            <h2 id="modal-name">
                Discord User
            </h2>


            <p id="modal-username">
                @username
            </p>


            <div
                id="modal-status"
                class="modal-status"
            >

                <span class="status-dot"></span>

                <span>
                    Offline
                </span>

            </div>


            <div
                id="modal-activity"
                class="modal-activity"
            ></div>


            <div class="modal-id">

                <span>
                    Discord ID:
                </span>

                <strong id="modal-discord-id">
                    -
                </strong>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        <div class="footer-threat">
            THREAT TO EVERYONE
        </div>

        <div class="footer-copy">
            PUBLIC ENEMY
        </div>

    </footer>

</div>


<!-- BACKGROUND MUSIC -->

<audio
    id="background-music"
    loop
    preload="auto"
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<script src="script.js"></script>

</body>

</html>
